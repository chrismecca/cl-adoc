<h1>Block Attributes</h1>
<p>An attribute line configures the block below it:</p>
<pre><code class="language-lisp">(+ 1 2)</code></pre>
<p>Only the names <code>source</code>, <code>stem</code>, and <code>pass</code> make an attribute line.</p>
<p>A bracketed line with any other name is ordinary text:</p>
<p>[1.2.0]</p>
<p>It can also sit inside a paragraph.
[aside]
The paragraph continues past it.</p>
