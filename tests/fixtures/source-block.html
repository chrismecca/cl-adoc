<p>A listing block keeps its contents literal.</p>
<pre><code class="language-lisp">(defun greet (name)
  (format t "hello, ~a~%" name))</code></pre>
<p>A listing block without a language attribute is still literal.</p>
<p>It has no language class.</p>
<pre><code>*not bold*  _not italic_  &lt;not a tag&gt;</code></pre>
